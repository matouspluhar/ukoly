<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Úkoly</title>
  <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191817" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/ukoly3-192.png">
  <link rel="apple-touch-icon" href="icons/ukoly3-192.png">
  <link rel="preload" href="fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="side" aria-label="Přehled">
      <div class="side-head"><span class="brand">Úkoly</span><span class="muted" data-today></span></div>
      <nav class="side-views">
        <button class="sv" data-view="den"><span>Můj den</span><span class="n" data-count="den"></span></button>
        <button class="sv" data-view="vse"><span>Všechny</span><span class="n" data-count="vse"></span></button>
      </nav>
      <div class="side-label">Zakázky a oblasti</div>
      <nav id="side-groups" class="side-groups"></nav>
    </aside>

    <div class="page">
      <header class="mast">
        <div class="mast-top">
          <span class="muted date" data-today></span>
          <button id="refresh" class="icon" aria-label="Obnovit"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <nav class="tabs">
          <button class="tab" data-view="den">Můj den<span class="n" data-count="den"></span></button>
          <button class="tab" data-view="vse">Všechny<span class="n" data-count="vse"></span></button>
        </nav>
        <h1 id="view-title" class="view-title"></h1>
        <div id="progress" class="progress" hidden></div>
      </header>

      <form id="add" autocomplete="off">
        <span class="plus" aria-hidden="true"></span>
        <input id="add-input" type="text" placeholder="Přidat úkol" enterkeyhint="done" aria-label="Nový úkol" title="Např. 2612 nakreslit sokl pá 2h !">
      </form>
      <div id="add-preview" class="add-preview" hidden></div>

      <main id="list"></main>

      <footer>
        <button id="status" class="status"></button>
        <span class="who"><span id="who"></span> · <button id="logout" class="link">odhlásit</button> · <span id="ver"></span></span>
      </footer>
    </div>

    <section id="detail" hidden aria-label="Detail úkolu">
      <div class="d-wrap">
        <div class="d-bar">
          <button id="d-back" class="link strong">Zavřít</button>
          <button id="d-done" class="btn">Hotovo</button>
        </div>
        <div id="d-group" class="d-group"></div>
        <textarea id="d-name" rows="1" aria-label="Název"></textarea>
        <dl class="spec">
          <dt>Termín</dt>
          <dd class="d-due"><input id="d-due" type="date"><button id="d-due-clear" class="link">zrušit</button></dd>
          <dt>Můj den</dt>
          <dd><button id="d-myday" class="switch" role="switch"><span></span></button></dd>
          <dt>Oheň</dt>
          <dd><button id="d-fire" class="switch fire" role="switch"><span></span></button></dd>
        </dl>
        <dl id="d-plan" class="spec plan" hidden></dl>
        <div id="d-links" class="links" hidden></div>
        <h2>Poznámka</h2>
        <textarea id="d-note" rows="4" placeholder="Napiš poznámku"></textarea>
        <h2>Souvislosti <span class="by">doplňuje Claude</span></h2>
        <div id="d-souv" class="souv"></div>
        <div id="d-log" class="log"></div>
        <p id="d-meta" class="meta"></p>
      </div>
    </section>
  </div>

  <div id="signin" hidden>
    <span class="brand big">Úkoly</span>
    <p id="signin-msg">Okno do složky MYSLENI/UKOLY</p>
    <button id="login" class="btn big">Přihlásit se</button>
    <p class="hint">Při přihlášení potvrď „Zůstat přihlášeni“ – pak se aplikace nebude ptát znovu.</p>
  </div>

  <div id="toast" hidden></div>

  <script src="vendor/msal-browser.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
